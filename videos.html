<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>فيديوهات - عالم المياه</title>

<style>
body{
    margin:0;
    font-family:'Comic Sans MS', cursive;
    background:url("kids-bg.png") no-repeat center center;
    background-size:cover;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    position:relative;
    padding-top:80px;
}

/* اللوجو */
.logo{
    position:absolute;
    top:20px;
    left:20px;
    width:80px;
}

/* العنوان */
h1{
    font-size:42px;
    color:#1f4e79;
    margin-bottom:40px;
}

/* الكونتينر للكروت */
.container{
    display:flex;
    gap:60px;
    flex-wrap:wrap;
    justify-content:center;
}

/* الكروت */
.card{
    width:320px;
    height:300px;
    border-radius:30px;
    padding:30px;
    color:white;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
    border:8px solid white;
    box-shadow:0 15px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

/* تدرجات الكروت */
.purple{
    background:linear-gradient(145deg,#8e44ad,#6c3483);
}

.orange{
    background:linear-gradient(145deg,#ff8c66,#f4a261);
}

/* صور داخل الكروت */
.card img{
    width:120px;
    margin-bottom:20px;
}

/* hover effect */
.card:hover{
    transform:translateY(-10px) scale(1.05);
}

/* شخصية الطفل */
.kid{
    position:absolute;
    right:40px;
    bottom:20px;
    width:220px;
}
</style>
</head>

<body>

<!-- اللوجو -->
<img src="logo.png" class="logo">

<h1>فيديوهات</h1>

<div class="container">
    <a href="story1.html" class="card purple">
        <img src="book.png" alt="قصة 1">
        قصة 1
    </a>

    <a href="story2.html" class="card purple">
        <img src="book.png" alt="قصة 2">
        قصة 2
    </a>

    <a href="story3.html" class="card purple">
        <img src="book.png" alt="قصة 3">
        قصة 3
    </a>
</div>

<!-- شخصية الطفل -->
<img src="hello-kid.png" class="kid">

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bills Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#1aa7ec;
  --dark:#0a2540;
  --light:#f4fbff;
  --blue:#1aa7ec;
  --dark:#0a2540;
  --light:#f4fbff;

  --grad-start:#1aa7ec;
  --grad-end:#0d6efd;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins', sans-serif;
  background:var(--light);
  color:var(--dark);
}

/* ===== NAVBAR ===== */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 8%;
  height:70px;
  background:#f0f8ff;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.nav-logo{
  height:50px;
}

nav ul{
  display:flex;
  list-style:none;
  gap:30px;
}

nav ul li a{
  text-decoration:none;
  color:#1a3a5f;
  font-weight:500;
}

nav ul li a.active{
  font-weight:700;
  
}

/* ===== DASHBOARD ===== */
.dashboard{
  max-width:1100px;
  margin:0 auto;
  padding:32px 24px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

/* ===== ALERT ===== */
.alert{
  background:#e8f6ff;
  border-left:5px solid var(--blue);
  padding:14px 18px;
  border-radius:12px;
  font-weight:500;
}

.welcome{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  padding:10px 0;
}

.welcome h2{
  font-size:36px;
  font-weight:700;
  background: linear-gradient(90deg, #1aa7ec, #0d6efd);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.welcome p{
  color:#666;
}

.welcome img{
  width:200px;
  height:auto;
  opacity:.9;
}

/* ===== PAGE TITLE ===== */
.page-title{
  font-size:36px;
  font-weight:700;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

@media(max-width:768px){
  .cards{
    grid-template-columns:1fr;
  }
}

.card{
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(26,58,95,.08);
}

.card h3{
  font-size:14px;
  color:#666;
  margin-bottom:6px;
}

.big{
  font-size:32px;
  font-weight:700;
}
button, .pay {
  margin-top:14px; padding:14px; width:100%;
  border: none;
  border-radius: 12px;
  background: linear-gradient(to right, var(--grad-start), var(--grad-end));
  color: white;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: block;
  margin: 20px 0 0 0;
  box-shadow: 0 4px 15px rgba(50, 204, 204, 0.3);
}

button:hover, .pay:hover {
  transform: scale(1.03);
  box-shadow: 0 6px 20px rgba(50, 204, 204, 0.4);
  filter: brightness(1.05);
}
.pay-btn:disabled{
  background:#d6d6d6;
  color:#777;
  cursor:default;
  transform:none;
}
/* ===== CHART ===== */
.chart{
  display:flex;
  align-items:flex-end;
  height:180px;
  gap:14px;
  margin-top:20px;
}

.bar{
  flex:1;
  background:#d7efff;
  border-radius:12px 12px 0 0;
  position:relative;
  cursor:pointer;
  transition:.3s;
}

.bar.active{background:var(--blue)}

.bar:hover{
  transform:translateY(-8px);
  background:linear-gradient(180deg,#1aa7ec,#0d6efd);
}

.bar span{
  position:absolute;
  bottom:-26px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
}

.bar::after{
  content:attr(data-value);
  position:absolute;
  top:-32px;
  left:50%;
  transform:translateX(-50%);
  background:var(--dark);
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  opacity:0;
  transition:.3s;
}

.bar:hover::after{opacity:1}

/* ===== MODAL ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.overlay.show{display:flex}

.modal{
  background:white;
  width:320px;
  padding:20px;
  border-radius:14px;
  position:relative;
}

.close-x{
  position:absolute;
  top:10px;
  right:14px;
  cursor:pointer;
  font-size:22px;
}

.input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ccc;
}

.row{
  display:flex;
  gap:10px;
}

.methods{
  display:flex;
  justify-content:space-around;
  margin:15px 0;
}

.pay-box{display:none}

.fawry-code{
  background:#f4fbff;
  border:1px dashed var(--blue);
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-weight:600;
}
</style>
</head>

<body>

<nav>
  <img src="logo.png" class="nav-logo">
  <ul>
    <li><a href="#">Dashboard</a></li>
    <li><a class="active" href="#">Bills</a></li>
    <li><a href="#">Settings</a></li>
  </ul>
</nav>

<div class="dashboard">

  <div class="alert">⚠️ Your usage spiked by 30% last night</div>

  <div class="welcome">
    <div>
      <h2>Hi, Shahd</h2>
    </div>
    <img src="hello-adult.svg">
  </div>

  <h1 class="page-title">Bills</h1>

  <div class="cards">
    <div class="card">
      <h3>Current Bill</h3>
      <div class="big" style="color:var(--blue)">155.00 EGP</div>
      <p>Due: 30 OCT</p>
      <button class="pay" onclick="pay()">Pay Now</button>
    </div>

    <div class="card">
      <h3>Usage – Current Month</h3>
      <div class="big">24 m³</div>
      <p>Normal range: 20–25</p>
    </div>
  </div>

  <div class="card">
    <h3>Usage – Last 6 Months</h3>
    <div class="chart">
      <div class="bar" style="height:40%" data-value="18 m³"><span>May</span></div>
      <div class="bar" style="height:70%" data-value="24 m³"><span>Jun</span></div>
      <div class="bar" style="height:35%" data-value="15 m³"><span>Jul</span></div>
      <div class="bar" style="height:55%" data-value="20 m³"><span>Aug</span></div>
      <div class="bar" style="height:75%" data-value="26 m³"><span>Sep</span></div>
      <div class="bar active" style="height:90%" data-value="30 m³"><span>Oct</span></div>
    </div>
  </div>

</div>

<div class="overlay" id="payBox">
  <div class="modal">
    <span class="close-x" onclick="closePay()">×</span>
    <h3>Bill Summary</h3>
    <p><b>Total:</b> 155.00 EGP</p>

    <div class="methods">
      <label><input type="radio" name="m" onclick="showMethod('card')"> Card</label>
      <label><input type="radio" name="m" onclick="showMethod('fawry')"> Fawry</label>
    </div>

    <div id="cardBox" class="pay-box">
      <input class="input" placeholder="Card Number">
      <div class="row">
        <input class="input" placeholder="MM/YY">
        <input class="input" placeholder="CVV">
      </div>
    </div>

    <div id="fawryBox" class="pay-box">
      <div class="fawry-code">8492 5531 9021</div>
    </div>

    <button class="pay">Confirm Payment</button>
  </div>
</div>

<script>
function pay(){ document.getElementById("payBox").classList.add("show"); }
function closePay(){ document.getElementById("payBox").classList.remove("show"); }
function showMethod(t){
  cardBox.style.display="none";
  fawryBox.style.display="none";
  if(t==="card") cardBox.style.display="block";
  if(t==="fawry") fawryBox.style.display="block";
}
</script>

</body>
</html>

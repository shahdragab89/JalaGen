<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <link rel="stylesheet" href="cards.css">
</head>
<body>

<h1>Memory Game 🌊</h1>

<div class="info">
  <div>⏱ Time: <span id="time">0</span>s</div>
  <div>⭐ Score: <span id="score">0</span></div>
</div>
<div>
<img src="hello-kid.png" class="background-character" alt="HI!"></div>

<button id="startBtn">Start Game</button>
<button id="restartBtn">Restart</button>

<div class="cards-container" id="game"></div>

<div id="winMessage" class="win">🎉 You Win! 🎉</div>

<script src="cards.js"></script>
</body>
</html>

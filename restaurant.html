<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>صفحتي مع الباب</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('restaurant.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .door-button {
            display: inline-block;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            transition: transform 0.3s ease, filter 0.3s ease;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            position: relative;
            /* ==========  دي السطر اللي هينزل الصورة ========== */
            margin-top: 30px;
            margin-left: -40px;  /* غيري الرقم ده حسب ما تحبي */
            /* ============================================= */
        }

        .door-button:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .door-button:active {
            transform: scale(0.98);
        }

        .door-image {
            display: block;
            width: 250px;
            height: auto;
            border: none;
            outline: none;
            border-radius: 0;
        }

        .door-text {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px black, 0 0 15px rgba(0,0,0,0.7);
            background-color: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 40px;
            white-space: nowrap;
            pointer-events: none;
            border: none;
            z-index: 2;
        }

        .top-spacer {
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="top-spacer"></div>
        
        <!-- التعديل هنا: بقا يودي على rest-kitchen.html -->
        <button class="door-button" onclick="window.location.href='rest-kitchen.html'">
            <img src="rest-door.png" alt="باب المطعم" class="door-image">
            <span class="door-text">اضغط على الباب</span>
        </button>
    </div>
</body>
</html>
